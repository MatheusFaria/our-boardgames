name: Sync Essen 2026 Auction Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
  push:
    paths:
      - "scripts/fetch_essen_auction.py"
      - ".github/workflows/sync-essen26-auction.yml"

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - name: Check Essen 2026 season window
        id: check
        run: |
          if [ "$(date -u +%Y%m%d)" -le 20261031 ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Essen 2026 season ended (after 2026-10-31); skipping sync."
          fi

  sync:
    needs: gate
    if: needs.gate.outputs.active == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Skip if already refreshed today
        id: freshness
        run: |
          today="$(date -u +%Y-%m-%d)"
          generated="$(python3 -c "import json; print(json.load(open('data/essen26_auction.json')).get('generatedAt', ''))" 2>/dev/null || true)"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${generated:0:10}" = "$today" ]; then
            echo "Snapshot already refreshed today ($generated); skipping this retry run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Regenerate Essen 2026 auction snapshot
        if: steps.freshness.outputs.skip != 'true'
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
        run: python3 scripts/fetch_essen_auction.py

      - name: Commit updated snapshot
        if: steps.freshness.outputs.skip != 'true'
        run: |
          if git diff --quiet -- data/essen26_auction.json; then
            echo "No snapshot changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/essen26_auction.json
          git commit -m "chore: refresh essen26 auction snapshot"

          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected; rebasing and retrying (attempt $attempt)"
            git pull --rebase origin main
          done
          echo "push failed after 5 attempts" >&2
          exit 1
