<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Essen 2026 Auction · Our Boardgames</title>
    <!-- Apply saved theme before paint to avoid flash -->
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>

    <!-- Mobile top bar (hidden on desktop via CSS) -->
    <header class="top-bar" id="top-bar">
      <input type="search" id="search-input-mobile" class="search-input search-input--topbar" placeholder="Search games…" autocomplete="off" />
      <button class="filter-toggle-btn" id="filter-toggle-btn" type="button" aria-label="Open filters">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
          <line x1="1" y1="3.5" x2="14" y2="3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="1" y1="7.5" x2="14" y2="7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="1" y1="11.5" x2="14" y2="11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="4.5" cy="3.5" r="1.8" fill="var(--surface-strong)" stroke="currentColor" stroke-width="1.2"/>
          <circle cx="10.5" cy="7.5" r="1.8" fill="var(--surface-strong)" stroke="currentColor" stroke-width="1.2"/>
          <circle cx="6.5" cy="11.5" r="1.8" fill="var(--surface-strong)" stroke="currentColor" stroke-width="1.2"/>
        </svg>
        Filters
      </button>
    </header>

    <div class="page">

      <!-- Hero -->
      <section class="hero">
        <div class="hero-inner">
          <h1 class="hero-title">Essen 2026 Auction</h1>
          <div class="meta-row">
            <div class="meta-item">
              <span class="meta-label">Matches</span>
              <span class="meta-value" id="meta-matches">—</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Listings</span>
              <span class="meta-value" id="meta-listings">—</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Games</span>
              <span class="meta-value" id="meta-games">—</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Synced</span>
              <span class="meta-value" id="meta-synced">—</span>
            </div>
          </div>
          <nav class="hero-actions">
            <a class="hero-nav" href="./essen26.html">← Essen 2026</a>
            <a class="hero-nav" href="./index.html">🏠 Our Boardgames</a>
          </nav>
        </div>
      </section>

      <!-- Content layout: sidebar + main -->
      <div class="content-layout">

        <!-- Drawer backdrop (mobile) -->
        <div class="drawer-backdrop" id="drawer-backdrop"></div>

        <!-- Sidebar / filter drawer -->
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-header">
            <span class="sidebar-title">Filters</span>
            <button class="sidebar-close-btn" id="sidebar-close-btn" type="button" aria-label="Close filters">✕</button>
          </div>
          <div class="sidebar-body">
            <div class="control-row">
              <div class="filter-group">
                <div class="filter-heading">
                  <h3 class="filter-title">Wishlist</h3>
                </div>
                <label class="toggle" for="wishlist-only-toggle">
                  <input type="checkbox" id="wishlist-only-toggle" checked />
                  On our wishlist only
                </label>
              </div>
              <div class="filter-group">
                <div class="filter-heading">
                  <h3 class="filter-title">Wanted by</h3>
                  <button class="filter-clear" id="clear-owner-filters" type="button">Clear</button>
                </div>
                <div class="filter-grid" id="owner-filter-grid"></div>
              </div>
              <div class="filter-group">
                <div class="filter-heading">
                  <h3 class="filter-title">Status</h3>
                  <button class="filter-clear" id="clear-status-filters" type="button">Clear</button>
                </div>
                <div class="filter-grid" id="status-filter-grid"></div>
              </div>
              <div class="filter-group">
                <div class="filter-heading">
                  <h3 class="filter-title">Buy-It-Now</h3>
                </div>
                <label class="toggle" for="has-bin-toggle">
                  <input type="checkbox" id="has-bin-toggle" />
                  Has Buy-It-Now
                </label>
              </div>
              <div class="filter-group">
                <div class="filter-heading">
                  <h3 class="filter-title">Max starting bid</h3>
                </div>
                <label class="range-filter" for="max-starting-bid-filter">
                  <span>Up to €</span>
                  <input id="max-starting-bid-filter" type="number" min="0" step="0.5" placeholder="Any" />
                </label>
              </div>
              <div class="sort-filter">
                <div class="filter-heading">
                  <h3 class="filter-title">Sold items</h3>
                </div>
                <div class="sort-options" id="sold-options"></div>
              </div>
              <div class="sort-filter">
                <div class="filter-heading">
                  <h3 class="filter-title">Your bids</h3>
                </div>
                <div class="sort-options" id="mybids-options"></div>
              </div>
              <div class="sort-filter">
                <div class="filter-heading">
                  <h3 class="filter-title">Sort by</h3>
                </div>
                <div class="sort-options" id="sort-options"></div>
              </div>
              <div class="sort-filter">
                <div class="filter-heading">
                  <h3 class="filter-title">Per page</h3>
                </div>
                <div class="sort-options" id="page-size-options"></div>
              </div>
              <div class="filter-group">
                <div class="filter-heading">
                  <h3 class="filter-title">Export</h3>
                </div>
                <button class="export-btn" id="export-csv-btn" type="button">Export matching games to CSV</button>
              </div>
              <div class="theme-toggle" id="theme-toggle">
                <button class="theme-option" id="theme-light-btn" type="button">
                  <span class="theme-icon">☀️</span> Light
                </button>
                <button class="theme-option" id="theme-dark-btn" type="button">
                  <span class="theme-icon">🌙</span> Dark
                </button>
              </div>
            </div>
          </div>
        </aside>

        <!-- Main content -->
        <div class="main-content">
          <div class="main-top">
            <div class="search-wrap">
              <input type="search" id="search-input" class="search-input" placeholder="Search games… (typos OK)" autocomplete="off" />
            </div>
            <div class="status loading" id="status-pill">Loading snapshot...</div>
          </div>
          <div id="active-filters" class="active-filters"></div>
          <div id="content"></div>
          <div id="pagination"></div>
        </div>

      </div><!-- /.content-layout -->
    </div><!-- /.page -->

    <script src="./vendor/html2canvas.min.js"></script>
    <script src="./share.js"></script>
    <script src="./essen26-auction.js"></script>
  </body>
</html>
